# Override de producao, aplicado por cima do compose.yaml da raiz, que continua
# sendo a fonte dos profiles, dos healthchecks e do resto da topologia. As imagens
# vem do Docker Hub em repositorio publico, entao o pull e anonimo: o host nao faz
# `docker login` nem guarda credencial. Use `--no-build`, senao o host tenta
# construir a imagem declarada no arquivo base em vez de usar a publicada.
# `pull_policy: always` fecha a outra metade: sem ele, um `up -d` reaproveita a
# imagem local e o SHA do `.env` deixa de ser o SHA que esta rodando.
#   docker compose -f compose.yaml -f infra/deploy/compose.prod.yaml --profile prod pull
#   docker compose -f compose.yaml -f infra/deploy/compose.prod.yaml --profile prod up -d --no-build

services:
  api:
    image: "${DOCKERHUB_USER:?}/skill-finder-api:${IMAGE_TAG:?}"
    pull_policy: always
    # Teto por container, nao reserva: o t3.small tem 2 GB e a soma dos tetos
    # (prod + obs) fica acima disso, entao quem protege a API de um vizinho
    # descontrolado e este valor, nao o scheduler.
    mem_limit: 600M

  postgres:
    mem_limit: 512M

  web:
    image: "${DOCKERHUB_USER:?}/skill-finder-web:${IMAGE_TAG:?}"
    pull_policy: always
    mem_limit: 96M

  grafana:
    # O `compose.yaml` (fora do escopo da #62) nao declara estas duas chaves e, sem
    # elas, o Grafana serve na raiz do proprio container: `/grafana/` chegaria como
    # rota desconhecida e a borda responderia 404. `root_url` e quem define o
    # sub-path; o `%(domain)s` so aparece em link absoluto (e-mail, OAuth), nunca na
    # navegacao, que e relativa ao sub-path. O lugar definitivo destas chaves e o
    # `compose.yaml`, para valer tambem em dev — ver §10 de
    # `docs/app/06-pipeline-deploy.md`.
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
