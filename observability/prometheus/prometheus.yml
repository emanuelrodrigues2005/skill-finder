# Scrape mínimo do projeto: a API e o host. Prometheus, Loki e Grafana não se
# raspam de propósito — self-scrape gastaria série sem responder pergunta de
# operação num host de 2 GB.
#
# 15 s é o passo que mantém `rate(...[5m])` com 60 pontos de folga (o painel RED
# e o critério da issue dependem dessa janela).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # `api` é o nome do serviço na rede do compose (e o alias que `api-dev` declara
  # no profile de dev): a borda responde 404 em `/metrics`, então a raspagem só
  # funciona dentro de `skills-search_default`.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
