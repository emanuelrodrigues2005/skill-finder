name: skills-search

# Profiles são **papéis**, não ambientes: na topologia de três VMs (ADR-011) cada
# host roda só o seu — `db` (`postgres`), `api` (`api`, mais o `obs`, que vive na
# mesma VM por ADR-013) e `web` —, e `dev` é o laço local, com os três num host só.
# Um arquivo por papel duplicaria healthcheck, `logging` e as ~20 variáveis da API
# em três lugares, que é o que um profile evita. `prod` continua como a composição
# de stack inteira que o `deploy.yml` e o runbook ainda invocam; sai quando a
# ADR-016 (deploy em três alvos, `db` → `api` → `web`) estiver no workflow.
#
# `ENV` é **fixo por serviço**, nunca interpolado do `.env`: um `.env` copiado do
# exemplo (`ENV=` vazio) ou um `--profile prod` sobre um `.env` de dev não podem
# resultar num "prod em modo dev". O schema (`backend/src/config/env.schema.ts`)
# ainda aborta o boot se `NODE_ENV=production` com `ENV!=prod`.
#
# Segredo entra por **variável de ambiente**, nunca por um arquivo injetado no
# container: em produção quem preenche o ambiente é o Infisical no host
# (`infisical secrets-manager run -- docker compose …`, ver
# `docs/app/06-pipeline-deploy.md`), e o `.env` deixa de existir na VM.
# Em dev o compose continua lendo `./.env` sozinho, mas só para **interpolar** estas
# linhas — o arquivo não é entregue inteiro ao container. Chave sem valor explícito
# chega vazia e o schema aplica o default (`dropEmptyStrings`), que é o que mantém
# `docker compose config` válido numa árvore limpa.
#
# Dois serviços de API porque o profile precisa escolher o `build.target`: `api`
# mantém o nome `api` que o Prometheus e o `frontend/nginx.dev.conf` (`api:8000`)
# esperam, e `api-dev` declara o alias `api` na rede do compose.
#
# `obs` só sobe a pedido (`--profile obs`): nada em `dev` ou `prod` muda por causa
# dele. A stack mora **aqui**, e não num `compose.obs.yaml` separado, porque
# `/metrics` responde `404` na borda (`frontend/nginx.conf`) e o Prometheus só
# alcança `api:8000` de dentro da rede `skills-search_default`. Um segundo arquivo
# criaria outra rede e nenhum alvo.

x-api-base: &api-base
  # Sem `depends_on: postgres`: o banco deixou de ser vizinho (ADR-011) e não existe
  # no profile `api`. A prontidão passa a ser o `/readyz`, que já faz `SELECT 1` — a
  # API sobe sem banco e responde 503 controlado em vez de não subir.
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/healthz"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s
  restart: unless-stopped

x-api-env: &api-env
  # Um banco gerenciado sobrescreve esta linha pela própria `DATABASE_URL` do
  # ambiente; o default derivado só existe para o stack `postgres` do compose.
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-skills}:${POSTGRES_PASSWORD:-skillsdev}@postgres:5432/${POSTGRES_DB:-skills}?schema=public}
  # Obrigatórias em prod (o schema recusa o boot sem elas); vazias em dev, onde o
  # `.env` decide e a rota admin falha fechado sem `ADMIN_TOKEN`.
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  IP_HASH_SALT: ${IP_HASH_SALT:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  # Repasse do restante da configuração: valor vazio = ausente, e quem tem default é
  # o schema. Declarar as chaves (em vez de entregar o arquivo inteiro ao container)
  # é o que permite o ambiente do host ser a única fonte em produção.
  LOG_LEVEL: ${LOG_LEVEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_ENABLED: ${LLM_ENABLED:-}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
  LLM_TOTAL_DEADLINE_MS: ${LLM_TOTAL_DEADLINE_MS:-}
  SKILL_SOURCE_KIND: ${SKILL_SOURCE_KIND:-}
  SKILL_SOURCE_BASE_URL: ${SKILL_SOURCE_BASE_URL:-}
  SKILL_SOURCE_RPS: ${SKILL_SOURCE_RPS:-}
  LIVE_ENRICH_ENABLED: ${LIVE_ENRICH_ENABLED:-}
  LIVE_ENRICH_MAX_KEYS: ${LIVE_ENRICH_MAX_KEYS:-}
  LIVE_ENRICH_MIN_INTERVAL_MS: ${LIVE_ENRICH_MIN_INTERVAL_MS:-}
  LIVE_ENRICH_BUDGET_MS: ${LIVE_ENRICH_BUDGET_MS:-}
  RANK_W_STARS: ${RANK_W_STARS:-}
  RANK_W_VULNS: ${RANK_W_VULNS:-}
  RANK_W_INSTALLS: ${RANK_W_INSTALLS:-}
  RATE_LIMIT_SEARCH_PER_MIN: ${RATE_LIMIT_SEARCH_PER_MIN:-}
  RATE_LIMIT_SEARCH_PER_DAY: ${RATE_LIMIT_SEARCH_PER_DAY:-}
  SEARCH_LOG_STORE_TEXT: ${SEARCH_LOG_STORE_TEXT:-}
  POSTGRES_USER: ${POSTGRES_USER:-skills}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsdev}
  POSTGRES_DB: ${POSTGRES_DB:-skills}

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db", "dev", "prod"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skills}
      POSTGRES_DB: ${POSTGRES_DB:-skills}
      # Default `skillsdev` só para a árvore limpa: `docker compose config` precisa
      # validar sem `.env` e o entrypoint oficial do postgres aborta com senha vazia.
      # Quem impede esse default de chegar em produção é o backend: em ENV=prod o
      # `env.schema.ts` recusa boot se a senha da DATABASE_URL for este valor.
      # O valor real em prod vem do Infisical, no ambiente do host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsdev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      # `json-file` sem teto é o que enche os 20 GiB de EBS: 10 MB × 3 arquivos
      # por container é o limite, e vale para todos os serviços deste arquivo.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Desenvolvimento: devDependencies + `pnpm start:dev`.
  api-dev:
    <<: *api-base
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    profiles: ["dev"]
    # Em `dev` o banco é vizinho: os três sobem no mesmo `docker compose up`, e a
    # espera que saiu da âncora continua valendo aqui.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases: ["api"]
    environment:
      <<: *api-env
      ENV: dev
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    volumes:
      # Só o que o `start:dev` recompila.
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Production profile: imagem de runtime, sem devDependencies e sem o `src/`.
  api:
    <<: *api-base
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    profiles: ["api", "prod"]
    environment:
      <<: *api-env
      ENV: prod
      # Fixado aqui para que um `NODE_ENV` do ambiente do host não flip o modo: a
      # imagem de runtime já nasce com `production`, e o par (NODE_ENV, ENV) é
      # conferido no boot.
      NODE_ENV: production
    ports:
      # O bind não é o controle de acesso: com a API numa VM só dela (ADR-011) quem
      # filtra a 8080 é o security group, que aceita a porta **apenas** de `sg-alb`.
      # `/metrics` sai no mesmo servidor (`/docs` só existe fora de prod), e a borda
      # do nginx não cobre essa porta.
      #
      # O default é loopback de propósito: um default permissivo vaza para todo
      # ambiente que não o sobrescreve. Quem precisa da 8000 aberta — o deploy —
      # exporta `API_BIND=0.0.0.0` explicitamente.
      #
      # Mais grave que `/metrics`: a partir do ALB a **chave do rate limit** também
      # passa a depender deste filtro. `X-Real-IP` é forjável sem o nginx na frente,
      # então o ALB não pode entrar no ar antes da ADR-015 no código.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["web", "dev", "prod"]
    depends_on:
      # Um único `web` serve `web`, `dev` e `prod`: `required: false` ignora o
      # serviço que o profile atual não habilita (o compose falharia com "depends
      # on undefined service" se a dependência fosse obrigatória).
      api:
        condition: service_healthy
        required: false
      api-dev:
        condition: service_healthy
        required: false
    ports:
      - "${WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      # O default é o arquivo de produção, que é só estático: quem pede o proxy de
      # dev é o `make`, que exporta `NGINX_CONF` apenas no profile `dev`. A escolha
      # não vem do `.env` — um `.env` de dev copiado para uma VM não pode montar o
      # proxy num stack `prod`.
      - "${NGINX_CONF:-./frontend/nginx.conf}:/etc/nginx/nginx.conf:ro"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # --- Profile `obs` -----------------------------------------------------------------
  #
  # Cinco containers, sem Telegraf e sem cAdvisor (ADR-009): o host é um `t3.small`
  # de 2 GB e a aplicação precisa caber junto. `mem_limit` soma 1,22 GiB de teto —
  # não de uso.
  #
  # Sem `healthcheck` de propósito: as imagens oficiais não trazem um cliente HTTP
  # confiável, e o `depends_on` entre eles é de ordem de boot, não de prontidão. A
  # prova de vida são os comandos de `observability/README.md`.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retenção por tempo **e** por tamanho: a série sai no que vier primeiro, e o
      # teto de 512 MB é o que impede o TSDB de encher o EBS de 20 GiB.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback: Prometheus não tem autenticação e a borda é o nginx.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    mem_limit: 320M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  loki:
    image: grafana/loki:3.3.2
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    mem_limit: 384M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  promtail:
    image: grafana/promtail:3.3.2
    profiles: ["obs"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Os dois pontos que o docker_sd precisa: o socket para descobrir o nome do
      # container, e o diretório de logs para ler. Ambos `:ro`.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    restart: unless-stopped
    mem_limit: 96M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["obs"]
    command:
      # Sem `--collector.disable-defaults` o exporter abre ~30 coletores e cobra
      # memória por séries que nenhum dos 4 painéis consulta.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.uname
      # O `/` do host em `/host`: sem isso o coletor de filesystem mede o overlay
      # do próprio container e não o disco que enche.
      - --path.rootfs=/host
    pid: host
    volumes:
      # Sem `rslave`: o `/` do WSL não é um mount shared, e o daemon recusa o
      # mount. A propagação só serviria para enxergar montagem criada depois do
      # boot — o disco que enche é o `/`, que já está aqui.
      - /:/host:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    restart: unless-stopped
    mem_limit: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["obs"]
    depends_on:
      - prometheus
      - loki
    environment:
      # Nunca literal: em produção quem preenche é o Infisical no ambiente do host.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # O host pode não ter saída para a internet: telemetria e checagem de versão
      # ficam desligadas para o boot não depender de rede.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Na VM do back o `/grafana/` entra pelo ALB (ADR-013): o filtro é o security
      # group, não o loopback. O default fica em loopback pelo mesmo motivo da `api`;
      # o deploy exporta `GRAFANA_BIND=0.0.0.0`.
      #
      # O Grafana lê **todos** os logs de container do host pelo Loki, então expô-lo
      # numa rede compartilhada (Wi-Fi de faculdade, VLAN de lab) entrega histórico de
      # log de graça — `GF_SECURITY_ADMIN_PASSWORD` não tem default e vem vazio sem
      # `.env`, o que deixaria `admin`/vazio.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    mem_limit: 384M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  promtail-data:
  grafana-data:
