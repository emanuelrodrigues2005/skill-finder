worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # nginx roda como usuário sem privilégio: temporários em /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  upstream api {
    server api:8000;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança da borda. `always` garante que saiam também nas
    # respostas de erro (4xx/5xx); sem isso, uma página de erro ficaria sem eles.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;

    # O navegador só fala com /api; quem fala com a LLM é o backend.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # `$remote_addr` e não `$proxy_add_x_forwarded_for`: a variante "add"
      # anexa o IP do cliente à lista que ele mesmo mandou, então o cliente
      # escolhe o próprio IP e o rate limit por `client_hash` (D2, #13) ganha
      # um bucket novo a cada requisição. Aqui a borda **sobrescreve** o header,
      # e a API nunca lê `X-Forwarded-For`.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 30s;
    }

    # A saúde da API vive fora do prefixo `/api/v1` (`PUBLIC_ROUTES` no backend).
    # Sem um proxy explícito, `/healthz` e `/readyz` cairiam no fallback da SPA e
    # responderiam `200 text/html` mesmo com a API morta — um smoke contra a borda
    # passaria escondendo o deploy quebrado.
    location = /healthz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location = /readyz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

      # A ingestao manual (#49) roda DENTRO do request e responde no fim: com o
      # adaptador `html` a 1 req/s, 20 chaves custam ~20 s so de espacamento,
      # mais a enumeracao do sitemap (indice + shards, no mesmo limitador) e ate
      # 10 s por detalhe quando a fonte degrada. O teto de 30 s do bloco acima
      # cortaria a conexao no meio: o operador veria `504` enquanto o run segue e
      # grava, e a retentativa receberia `409` (trava tomada) - um "falhou" que
      # nao falhou.
      #
      # 240 s cobre 20 x (1 s + 10 s de teto) com folga. O prefixo mais longo
      # vence no nginx, entao o bloco do `/api/` continua valendo para o resto.
      location /api/v1/admin/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 240s;
      }

    # Reservado para a F5 (Grafana atrás do mesmo host).
    # location /grafana/ {
    #   proxy_pass http://grafana:3000/;
    # }

    # Fallback da SPA: qualquer rota do React Router devolve o index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
