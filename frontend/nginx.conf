# Borda estática: a SPA e o fallback do React Router. O roteamento de `/api`,
# `/healthz`, `/readyz` e `/grafana/` é do listener do ALB (ADR-014), não daqui.
# Este nginx não escreve mais os cabeçalhos de IP do cliente: a identidade é
# responsabilidade do salto confiável, o ALB (ADR-015).
# `/api` aqui responde `200 text/html` (o fallback da SPA): não publicar antes de
# o listener do ALB rotear `/api`, `/healthz`, `/readyz` e `/grafana/`.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # nginx roda como usuário sem privilégio: temporários em /tmp — inclusive o do
  # módulo proxy, que cria o diretório padrão no boot (`/var/cache/nginx`) mesmo
  # sem `proxy_pass`.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança da borda. `always` garante que saiam também nas
    # respostas de erro (4xx/5xx); sem isso, uma página de erro ficaria sem eles.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;

    # Métricas expõem contadores de rota e latência; o Prometheus raspa `api:8000` na rede interna.
    location = /metrics {
      return 404;
    }

    # Fallback da SPA: qualquer rota do React Router devolve o index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
