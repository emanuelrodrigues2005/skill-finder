# Borda de desenvolvimento, usada **só** por `make dev` (profile `dev`): estático
# mais o proxy que a SPA precisa, porque em dev não existe ALB. Em produção vale
# `frontend/nginx.conf`, que é só estático — os outros caminhos de lá são
# roteados pelo listener do ALB (ADR-014).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # nginx roda como usuário sem privilégio: temporários em /tmp — inclusive o do
  # módulo proxy, que cria o diretório padrão no boot (`/var/cache/nginx`) mesmo
  # sem `proxy_pass`.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `api` é o alias que o `api-dev` declara na rede do compose. O nome vai numa
    # variável, e não direto no `proxy_pass`, para a resolução ser por requisição
    # (DNS do Docker em 127.0.0.11): o boot não depende de `api` existir e um
    # `api-dev` recriado não deixa o IP antigo em cache.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Cabeçalhos de segurança da borda. `always` garante que saiam também nas
    # respostas de erro (4xx/5xx); sem isso, uma página de erro ficaria sem eles.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;

    # O navegador só fala com /api; quem fala com a LLM é o backend.
    location /api/ {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Sobrescreve em vez de anexar (`$proxy_add_x_forwarded_for` deixaria o
      # cliente escolher o próprio IP e o rate limit ganharia um bucket por
      # requisição). ADR-015: a API lê `X-Forwarded-For`, nunca `X-Real-IP`.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 30s;
    }

    # A ingestão manual (#49) responde no fim do request: 20 chaves a 1 req/s mais
    # até 10 s por detalhe não cabem nos 30 s do bloco acima. O prefixo mais longo
    # vence no nginx, então o resto do `/api/` continua com o teto de 30 s.
    location /api/v1/admin/ {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 240s;
    }

    # A saúde da API vive fora do prefixo `/api/v1` (`PUBLIC_ROUTES` no backend).
    # Sem proxy explícito, `/healthz` e `/readyz` cairiam no fallback da SPA e
    # responderiam `200 text/html` com a API morta.
    location = /healthz {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location = /readyz {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # Métricas expõem contadores de rota e latência; o Prometheus raspa `api:8000` na rede interna.
    location = /metrics {
      return 404;
    }

    # Fallback da SPA: qualquer rota do React Router devolve o index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
