# Configuração do pnpm para este pacote (pnpm >= 10 lê daqui, não do package.json).
#
# `allowBuilds` autoriza (ou não) script de postinstall por dependência. O esbuild,
# que o Vite usa, baixa o binário da plataforma nesse passo: sem autorização, o
# `vite build` falha com "esbuild: command not found".
allowBuilds:
  esbuild: true
  # O `postinstall` do msw só imprime um lembrete de `msw init`; o `msw/node` da
  # suíte (issue #29) não depende dele. Negado de propósito, para o `pnpm install`
  # não parar com ERR_PNPM_IGNORED_BUILDS nem rodar script de terceiro à toa.
  msw: false
